name: MediCycle tests

on:
  push:
    branches:
      - feature/customer-welcome-credit
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx2
      - name: Run isolated test suite
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_NAME: medicycle
          JWT_SECRET: unit-test-secret-not-for-production-use-0123456789
        run: pytest -q
