name: Apply MediCycle medicine migration

on:
  push:
    branches:
      - feature/my-medicines-live-integration
    paths:
      - ".github/workflows/apply-medicine-migration.yml"

permissions:
  contents: read

concurrency:
  group: medicycle-medicine-migration-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3.0" "PyMySQL>=1.1" "python-dotenv>=1.0"
      - name: Validate required database secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD", "DB_NAME"]
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              print("Missing or empty GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          print("All five database secrets are present.")
          PY
      - name: Apply additive migration
        env:
          PYTHONPATH: .
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/migrate_medicine_tracking.py --apply
      - name: Run read-only post-migration preflight
        env:
          PYTHONPATH: .
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/preflight_live_data.py
