name: Read-only TiDB schema snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - ops/run-readonly-tidb-schema-snapshot
    paths:
      - .github/workflows/readonly-tidb-schema.yml
      - scripts/inspect_live_schema_ci.py

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - name: Check required secrets are configured
        shell: bash
        run: |
          for key in DB_HOST DB_USER DB_PASSWORD DB_NAME; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret for $key. Check the existing DB_* repository secrets in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inspection dependencies
        run: python -m pip install "SQLAlchemy>=2.0,<2.1" "PyMySQL>=1.1"
      - name: Inspect database metadata (read-only)
        run: python scripts/inspect_live_schema_ci.py
      - name: Upload schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: medicycle-live-schema-snapshot
          path: live_schema_snapshot.json
          if-no-files-found: error
          retention-days: 7
