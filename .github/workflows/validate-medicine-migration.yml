name: Validate MediCycle medicine migration (read only)

on:
  push:
    branches:
      - feature/my-medicines-live-integration
    paths:
      - ".github/workflows/validate-medicine-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicycle-medicine-migration-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only inspection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3.0" "PyMySQL>=1.1" "python-dotenv>=1.0"
      - name: Validate additive schema using information_schema (SELECT only)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python - <<'PY'
          import os, sys, json
          from sqlalchemy import URL, create_engine, text

          keys = ("DB_HOST", "DB_PORT", "DB_USER", "DB_PASSWORD", "DB_NAME")
          missing = [k for k in keys if not os.getenv(k, "").strip()]
          if missing:
              raise SystemExit("Missing database secrets: " + ", ".join(missing))
          for key in ("DB_HOST", "DB_PORT", "DB_USER", "DB_NAME"):
              os.environ[key] = os.environ[key].strip()

          url = URL.create(
              "mysql+pymysql", username=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"], host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]), database=os.environ["DB_NAME"],
              query={"charset": "utf8mb4"},
          )
          engine = create_engine(url, pool_pre_ping=True)
          schema = os.environ["DB_NAME"]
          problems = []
          report = {}
          with engine.connect() as conn:
              tables = set(conn.execute(text("""
                  SELECT TABLE_NAME FROM information_schema.TABLES
                  WHERE TABLE_SCHEMA=:s AND TABLE_TYPE='BASE TABLE'
              """), {"s": schema}).scalars())
              report["table_count"] = len(tables)
              preparer = engine.dialect.identifier_preparer
              row_counts = {}
              for table_name in sorted(tables):
                  quoted = preparer.quote(table_name)
                  row_counts[table_name] = int(conn.execute(
                      text("SELECT COUNT(*) FROM " + quoted)
                  ).scalar_one())
              report["live_row_counts_by_table"] = row_counts
              report["live_total_rows"] = sum(row_counts.values())
              report["returnBucketItem_exists"] = "returnBucketItem" in tables
              if not {"userMedicine", "returnBucketItem", "user", "returnRequest"}.issubset(tables):
                  problems.append("One or more required tables are missing")

              cols = conn.execute(text("""
                  SELECT COLUMN_NAME, DATA_TYPE, CHARACTER_MAXIMUM_LENGTH,
                         IS_NULLABLE, COLUMN_DEFAULT
                  FROM information_schema.COLUMNS
                  WHERE TABLE_SCHEMA=:s AND TABLE_NAME='userMedicine'
              """), {"s": schema}).mappings().all()
              actual = {r["COLUMN_NAME"]: r for r in cols}
              expected = {
                  "sourcePlatform": ("varchar", 40, "YES"),
                  "externalOrderId": ("varchar", 255, "YES"),
                  "purchaseDate": ("date", None, "YES"),
                  "isDemo": ("tinyint", None, "NO"),
              }
              for name, (dtype, length, nullable) in expected.items():
                  col = actual.get(name)
                  if col is None:
                      problems.append("userMedicine missing " + name)
                  elif (col["DATA_TYPE"].lower() != dtype
                        or (length is not None and col["CHARACTER_MAXIMUM_LENGTH"] != length)
                        or col["IS_NULLABLE"] != nullable):
                      problems.append("userMedicine." + name + " type/length/nullability mismatch")
              report["userMedicine_new_columns_present"] = all(n in actual for n in expected)

              bucket_count = None
              index_rows = []
              if "returnBucketItem" in tables:
                  rows = conn.execute(text("""
                      SELECT COLUMN_NAME, DATA_TYPE, CHARACTER_MAXIMUM_LENGTH, IS_NULLABLE
                      FROM information_schema.COLUMNS
                      WHERE TABLE_SCHEMA=:s AND TABLE_NAME='returnBucketItem'
                  """), {"s": schema}).mappings().all()
                  bucket_cols = {r["COLUMN_NAME"]: r for r in rows}
                  expected_bucket = {
                      "bucketItemId": ("char", 32, "NO"),
                      "userId": ("char", 32, "NO"),
                      "userMedicineId": ("char", 32, "NO"),
                      "status": ("varchar", 40, "NO"),
                      "createdAt": ("datetime", None, "NO"),
                      "submittedReturnId": ("char", 32, "YES"),
                  }
                  if set(bucket_cols) != set(expected_bucket):
                      problems.append("returnBucketItem column set mismatch")
                  for name, (dtype, length, nullable) in expected_bucket.items():
                      col = bucket_cols.get(name)
                      if col and (col["DATA_TYPE"].lower() != dtype
                          or (length is not None and col["CHARACTER_MAXIMUM_LENGTH"] != length)
                          or col["IS_NULLABLE"] != nullable):
                          problems.append("returnBucketItem." + name + " type/length/nullability mismatch")

                  pk = conn.execute(text("""
                      SELECT COLUMN_NAME FROM information_schema.KEY_COLUMN_USAGE
                      WHERE TABLE_SCHEMA=:s AND TABLE_NAME='returnBucketItem'
                        AND CONSTRAINT_NAME='PRIMARY' ORDER BY ORDINAL_POSITION
                  """), {"s": schema}).scalars().all()
                  if pk != ["bucketItemId"]:
                      problems.append("returnBucketItem primary key mismatch")

                  fk_rows = conn.execute(text("""
                      SELECT COLUMN_NAME, REFERENCED_TABLE_NAME, REFERENCED_COLUMN_NAME
                      FROM information_schema.KEY_COLUMN_USAGE
                      WHERE TABLE_SCHEMA=:s AND TABLE_NAME='returnBucketItem'
                        AND REFERENCED_TABLE_NAME IS NOT NULL
                  """), {"s": schema}).all()
                  actual_fks = {(r[0], r[1], r[2]) for r in fk_rows}
                  expected_fks = {
                      ("userId", "user", "userId"),
                      ("userMedicineId", "userMedicine", "userMedicineId"),
                      ("submittedReturnId", "returnRequest", "returnId"),
                  }
                  if not expected_fks.issubset(actual_fks):
                      problems.append("returnBucketItem foreign-key targets incomplete")

                  index_rows = conn.execute(text("""
                      SELECT INDEX_NAME, COLUMN_NAME, NON_UNIQUE, SEQ_IN_INDEX
                      FROM information_schema.STATISTICS
                      WHERE TABLE_SCHEMA=:s AND TABLE_NAME='returnBucketItem'
                      ORDER BY INDEX_NAME, SEQ_IN_INDEX
                  """), {"s": schema}).all()
                  grouped = {}
                  for name, column, non_unique, seq in index_rows:
                      grouped.setdefault(name, []).append((column, int(non_unique)))
                  unique_single_column = any(
                      len(items) == 1 and items[0][0] == "userMedicineId"
                      and items[0][1] == 0 and name != "PRIMARY"
                      for name, items in grouped.items()
                  )
                  report["returnBucketItem_indexes"] = {
                      name: [column for column, _ in items] for name, items in grouped.items()
                  }
                  if not unique_single_column:
                      problems.append("Missing single-column UNIQUE index on returnBucketItem.userMedicineId")

                  bucket_count = int(conn.execute(text(
                      "SELECT COUNT(*) FROM returnBucketItem"
                  )).scalar_one())

              um_count = int(conn.execute(text(
                  "SELECT COUNT(*) FROM userMedicine"
              )).scalar_one())
              report["userMedicine_rows"] = um_count
              report["returnBucketItem_rows"] = bucket_count
              report["problems"] = problems

          engine.dispose()
          print(json.dumps(report, indent=2, default=str))
          if problems:
              sys.exit(1)
          print("PASS: additive schema checks passed; inspection used SELECT statements only.")
          PY
      - name: Run existing read-only data integrity preflight
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os, runpy
          for key in ("DB_HOST", "DB_PORT", "DB_USER", "DB_NAME"):
              os.environ[key] = os.environ[key].strip()
          runpy.run_path("scripts/preflight_live_data.py", run_name="__main__")
          PY
